<!DOCTYPE html>

    </head>
    <body>
        <div>
            <header>
                <img src="./img/logo.png" alt="HBO Max">

            </header>
            <main>
                <h1>Entre</h1>
                <p>Digite seu endereço de e-mail ou número de celular para entrar.</p>

                    <div class="field">
                        <label for="contato">Endereço de e-mail ou número de celular</label><br>

                    <button type="submit">Continue</button> 
                </form>

            </main>
            <footer>

                    <li>
                        <img src="./img/youtube.png" alt="Youtube">

                    <li>
                        <img src="./img/facebook.png" alt="Facebook">
                    </li>
                    <li>

                    </li>
                    <li>
                        <img src="./img/tiktok.png" alt="tiktok">
                    </li>
                </ul>
                <p>© 2026 WarnerMedia Direct, LLC. Todos os direitos reservados.</p>
            </footer>
        </div>
